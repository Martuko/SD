version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: sd-ollama-1
    runtime: nvidia
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=10m
    volumes:
      - ./ollama:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  llm:
    build: ./Servicios/LLM
    container_name: sd-llm-1
    command: uvicorn app:app --host 0.0.0.0 --port 8000
    environment:
      - OLLAMA_HOST=http://sd-ollama-1:11434
      - LLM_MODEL=llama3.2:3b-instruct-q4_K_M
      - LLM_MAX_TOKENS=160
      - LLM_TEMPERATURE=0.2
      - LLM_CONCURRENCY=1
      - LLM_NUM_CTX=2048
      - KAFKA_BOOTSTRAP=kafka:9092
      - TOPIC_LLM=questions.llm
      - TOPIC_ANSWERS=questions.answers
    depends_on:
      - init-topics
      - kafka
      - ollama
    ports:
      - "8000:8000"
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: sd-redis-1
    restart: unless-stopped

  cache:
    build: ./Servicios/Cache
    container_name: sd-cache-1
    command: uvicorn app:app --host 0.0.0.0 --port 8001
    environment:
      - REDIS_URL=redis://sd-redis-1:6379/0
      - CACHE_POLICY=allkeys-lru
      - CACHE_MAX_ENTRIES=5000
      - CACHE_TTL=86400
      - KAFKA_BOOTSTRAP=kafka:9092
      - TOPIC_REQUESTS=questions.requests
      - TOPIC_LLM=questions.llm
      - TOPIC_ANSWERS=questions.answers
      - TOPIC_CACHE_UPDATE=cache.update
      - TOPIC_CACHE_METRICS=cache.metrics
    depends_on:
      - init-topics
      - kafka
      - redis
    ports:
      - "8001:8001"
    restart: unless-stopped

  score:
    build: ./Servicios/Score
    container_name: sd-score-1
    environment:
      - KAFKA_BOOTSTRAP=kafka:9092
      - TOPIC_ANSWERS=questions.answers
      - TOPIC_STORAGE=storage.persist
      - TOPIC_CACHE_UPDATE=cache.update
      - ENABLE_EMBEDDINGS=1
      - ENABLE_ROUGE=1
      - ENABLE_BERTSCORE=0
      - SCORE_THRESHOLD=0.6
    depends_on:
      - init-topics
      - kafka
      - llm
      - storage
    ports:
      - "8002:8002"
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: sd-db-1
    environment:
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=app
      - POSTGRES_DB=qa
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d qa || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  storage:
    build: ./Servicios/Storage
    container_name: sd-storage-1
    command: uvicorn app:app --host 0.0.0.0 --port 8003
    environment:
      - DATABASE_URL=postgresql://app:app@sd-db-1:5432/qa
      - DB_INIT_MAX_RETRIES=60
      - DB_INIT_RETRY_DELAY=1.0
      - KAFKA_BOOTSTRAP=kafka:9092
      - TOPIC_STORAGE=storage.persist
    depends_on:
      init-topics:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      db:
        condition: service_healthy
    ports:
      - "8003:8003"
    volumes:
      - ./data:/data
    restart: unless-stopped

  traffic:
    build: ./Servicios/Traffic
    container_name: sd-traffic-1
    command: uvicorn app:app --host 0.0.0.0 --port 8010
    volumes:
      - ./data:/data
    environment:
      - CSV_PATH=/data/test.csv
      - AUTOSTART=0
      - SAMPLE_LIMIT=10000
      - DIST=poisson
      - RATE=5.0
      - CONCURRENCY=2
      - DURATION=3600
      - REPEAT_POOL_SIZE=0
      - KAFKA_BOOTSTRAP=kafka:9092
      - TOPIC_REQUESTS=questions.requests
    depends_on:
      - init-topics
      - kafka
      - cache
      - storage
    ports:
     - "8010:8010"
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: sd-zookeeper-1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: sd-kafka-1
    hostname: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: sd-zookeeper-1:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      zookeeper:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  kafdrop:
    image: obsidiandynamics/kafdrop
    container_name: sd-kafdrop-1
    depends_on:
      - kafka
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:9092
    restart: unless-stopped

  init-topics:
    image: confluentinc/cp-kafka:7.4.0
    container_name: sd-init-topics-1
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic questions.requests --partitions 1 --replication-factor 1 &&
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic questions.llm --partitions 1 --replication-factor 1 &&
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic questions.answers --partitions 1 --replication-factor 1 &&
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic storage.persist --partitions 1 --replication-factor 1 &&
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic cache.update --partitions 1 --replication-factor 1 &&
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic cache.metrics --partitions 1 --replication-factor 1
      "
    restart: "no"

volumes:
  ollama:
  dbdata:
